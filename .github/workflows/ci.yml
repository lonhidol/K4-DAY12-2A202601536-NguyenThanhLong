name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -v

      - name: Build Docker image
        run: docker build -t day12-chat:latest .

  deploy:
    name: Deploy Service
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Cloud
        run: echo "Deploying to production with ${{ secrets.RAILWAY_TOKEN }}"
